framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            - assets/
        # Template CSS (assets/vendor/template/css/all.min.css) referiše slike plugin-a koje nismo kopirali
        # (leaflet, login_cover.jpg, boxed_bg.png). CSS se ne menja, pa ovo ostaje 'warn' i u dev okruženju.
        missing_import_mode: warn
